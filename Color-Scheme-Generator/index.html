<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <input type="color" id="color-pick">
            <select id="mode">
                <option>Monochrome</option>
                <option>Monochrome-dark</option>
                <option>Monochrome-light</option>
                <option>Analogic</option>
                <option>Complement</option>
                <option>Analogic-complement</option>
                <option>Triad</option>
            </select>
            <button id="btn">Get color scheme</button>
        </header>
        <main>
            <div class="colors-grid">
                <div class="color" id="c1"><span class="color-code" id="hex1">#F55A5A</span></div>
                <div class="color" id="c2"><span class="color-code" id="hex2">#2B283A</span></div>
                <div class="color" id="c3"><span class="color-code" id="hex3">#FBF3AB</span></div>
                <div class="color" id="c4"><span class="color-code" id="hex4">#AAD1B6</span></div>
                <div class="color" id="c5"><span class="color-code" id="hex5">#A626D3</span></div>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
