<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <input type="color">
            <select>
                <option>Monochrome</option>
                <option>Monochrome-dark</option>
                <option>Monochrome-light</option>
                <option>Analogic</option>
                <option>Complement</option>
                <option>Analogic-complement</option>
                <option>Triad</option>
            </select>
            <button>Get color scheme</button>
        </header>
        <main>
            <div class="colors-grid">
                <div class="color c1"><div class="color-code">#F55A5A</div></div>
                <div class="color c2"><div class="color-code">#2B283A</div></div>
                <div class="color c3"><div class="color-code">#FBF3AB</div></div>
                <div class="color c4"><div class="color-code">#AAD1B6</div></div>
                <div class="color c5"><div class="color-code">#A626D3</div></div>
            </div>

        </main>
        <script src="index.js"></script>
    </body>
</html>
